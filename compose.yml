services:
  mysql:
    image: mysql:8.0
    ports:
      - '127.0.0.1:3306:3306'
    environment:
      MYSQL_DATABASE: studyplanner
      MYSQL_USER: studyplanner
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your shell}
    volumes:
      - studyplanner_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  studyplanner_mysql:
