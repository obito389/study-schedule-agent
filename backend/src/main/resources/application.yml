server:
  address: 127.0.0.1
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/studyplanner;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
